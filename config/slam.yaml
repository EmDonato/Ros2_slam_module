slam_bringup:
  ros__parameters:
    # mapping: continua una mappa esistente oppure ne crea una nuova.
    # reset_mapping: elimina il database prima di creare una nuova mappa.
    # localization: usa il database esistente senza aggiungere nuovi nodi.
    mode: "reset_mapping"

    namespace: "rtabmap"
    log_level: "info"
    database_path: "/data/rtabmap.db"

    # Input RealSense.
    rgb_topic: "/camera/realsense/color/image_raw"
    depth_topic: "/camera/realsense/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/realsense/color/camera_info"

    # Odometria prodotta dall'EKF.
    odom_topic: "/odom"

    # Output relativi al namespace /rtabmap.
    map_topic: "map"
    map_data_topic: "mapData"
    map_graph_topic: "mapGraph"
    cloud_map_topic: "cloud_map"
    info_topic: "info"


rtabmap:
  ros__parameters:
    use_sim_time: false


    frame_id: "base_link"
    map_frame_id: "map"
    odom_frame_id: ""
    publish_tf: true

    subscribe_rgb: true
    subscribe_depth: true
    subscribe_rgbd: false
    subscribe_stereo: false
    subscribe_scan: false
    subscribe_scan_cloud: false
    subscribe_odom_info: false

    approx_sync: true
    approx_sync_max_interval: 0.10
    odom_sensor_sync: true

    topic_queue_size: 30
    sync_queue_size: 30
    wait_for_transform: 0.2

   
    qos_image: 2
    qos_camera_info: 2
    qos_odom: 1

    latch: true
    map_cleanup: true
    map_always_update: false
    cloud_output_voxelized: true
    cloud_subtract_filtering: false

    "Rtabmap/DetectionRate": "3.0"

    "Reg/Strategy": "0"
    "Reg/Force3DoF": "true"

    "RGBD/LinearUpdate": "0.10"
    "RGBD/AngularUpdate": "0.10"
    "RGBD/ProximityBySpace": "true"
    "RGBD/CreateOccupancyGrid": "true"

    "Mem/BinDataKept": "true"

    "Kp/MaxDepth": "4.0"
    "Vis/MinInliers": "15"

    "Grid/Sensor": "1"
    "Grid/3D": "true"
    "Grid/DepthDecimation": "4"
    "Grid/CellSize": "0.05"
    "Grid/RangeMin": "0.20"
    "Grid/RangeMax": "5.0"
    "Grid/MaxObstacleHeight": "2.0"
    "Grid/RayTracing": "true"
    "Grid/NormalsSegmentation": "true"